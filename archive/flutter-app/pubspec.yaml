name: athan_app_v2
description: "Prayer Times App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.1.0
  geolocator: ^10.0.0
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  google_fonts: ^6.2.1
  awesome_notifications: ^0.10.1
  timezone: ^0.10.0
  geocoding: ^4.0.0
  adhan: ^2.0.0+1
  hijri: ^3.0.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - "assets/sounds/notification.mp3"
    - assets/images/

  fonts:
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/ElMessiri-VariableFont_wght.ttf
    - family: Qahiri
      fonts:
        - asset: assets/fonts/Qahiri-Regular.ttf
